[tool.poetry]
name = "grail_metabolism"
version = "0.2.0"
description = "Graph neural networks and rule-based drug metabolism prediction"
authors = [
  "Nikita L. Polomoshnov <nikitapol@fbb.msu.ru>",
  "Anastasia V. Rudik",
]
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["chemoinformatics", "drug-metabolism", "gnn", "rdkit", "smirks"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
packages = [{ include = "grail_metabolism" }]
# Named one by one rather than globbed. A glob over this directory would put the measured bank
# into a wheel built in a checkout that happens to hold it, and the measured bank is exactly
# what the licence work removed: it carries 611 templates BioTransformer's published set
# also contains, which this project has no permission to redistribute. The released bank is
# the one that ships.
include = [
  "grail_metabolism/resources/extended_smirks_released.txt",
  "grail_metabolism/resources/example_rules.txt",
  "grail_metabolism/resources/mined_only.txt",
  "grail_metabolism/resources/mined_only_v2.txt",
  "grail_metabolism/resources/notebooks_rules.txt",
  "grail_metabolism/resources/slow_substrates.txt",
]
exclude = [
  ".DS_Store",
  # the measured bank: this FILE is kept out of the wheel, which is not the same as the
  # templates being absent from the repository -- see NOTICE.md and
  # scripts/check_no_withheld_templates.py
  "grail_metabolism/resources/extended_smirks.txt",
  "AUDIT_REPORT.md",
  "RESULTS.md",
  "artifacts/**",
  "dist/**",
  "docs/**",
  "gens.smi",
  "grail_metabolism/data/**",
  "grail_metabolism/*.csv.gz",
  "grail_metabolism/*.html",
  "grail_metabolism/*.hdf5",
  "grail_metabolism/*.onnx",
  "grail_metabolism/*.pth",
  "grail_metabolism/*.smarts",
  "grail_metabolism/.DS_Store",
  "grail_metabolism/lib/**",
  "grail_metabolism/network.html",
  "grail_metabolism/single_molecule_network.html",
  "grail_metabolism/venv/**",
  "img/**",
  "notebooks/**",
  "prod.pkl",
  "results/**",
  "sub.pkl",
  "timeout.log",
  "xtr.txt",
]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
numpy = ">=1.24,<2.0"
pandas = "^2.2.3"
rdkit = "2022.9.5"           # exact: tautomer canonicalisation is not stable across releases
scikit-learn = "^1.5.2"
scipy = ">=1.11,<2.0"
torch = "^2.4.1"
torch-geometric = ">=2.4,<3.0"
matplotlib = "^3.9.2"
seaborn = { version = "^0.13.2", optional = true }
tqdm = ">=4.65,<5.0"
pyvis = "^0.3.2"
pillow = ">=11.0,<13.0"
pyyaml = "^6.0.2"
streamlit = { version = "^1.45.1", optional = true }
optuna = { version = "^4.3.0", optional = true }
sygma = { version = "1.1.0", optional = true }

[tool.poetry.extras]
plots = ["seaborn"]
app = ["streamlit"]
tuning = ["optuna"]
baselines = ["sygma"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
build = "^1.2.2"
twine = "^6.1.0"

[tool.poetry.scripts]
grail = "grail_metabolism.cli:main"
grail-metabolites = "grail_metabolism.deploy.predict_cli:main"

[tool.pytest.ini_options]
testpaths = ["grail_metabolism/tests"]
norecursedirs = [
  ".git",
  ".idea",
  ".ipynb_checkpoints",
  "dist",
  "grail_metabolism/data",
  "grail_metabolism/lib",
  "grail_metabolism/venv",
  "notebooks",
]

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
